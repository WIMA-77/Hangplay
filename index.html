<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Handpan Player</title>
<style>
:root{--bg:#09090b;--tx:#ead9b0;--ac:#d6a64a}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;color:var(--tx);font-family:ui-monospace,Menlo,Consolas,monospace;touch-action:none;user-select:none;-webkit-user-select:none;background:radial-gradient(ellipse 90% 55% at 50% 26%,#2b1f12 0%,#15111a 48%,#09090b 100%)}
body{display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 6px env(safe-area-inset-bottom);position:relative}
#ttl{display:flex;align-items:center;gap:10px;width:min(96vw,780px);margin-top:8px}#ttl i{flex:1;height:1px;background:linear-gradient(90deg,transparent,#a8823a,transparent)}
#ttl b{letter-spacing:6px;font-size:13px;color:#f4e6c0;text-shadow:0 0 12px #d6a64a88}
#info{font-size:11px;opacity:.6;margin:3px 0}
#spr{image-rendering:pixelated}
#wrap{flex:1;min-height:0;width:100%;display:flex;justify-content:center}
#hang{touch-action:none;display:block}
#bar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 12px;background:#14110ccc;backdrop-filter:blur(6px);border:1px solid #a8823a66;border-radius:14px;margin:4px 0 8px;font-size:12px;box-shadow:0 6px 24px #000a}
select,button{font:700 12px ui-monospace,Menlo,monospace;background:#1f1a10;color:var(--tx);border:1px solid #a8823a99;border-radius:9px;padding:8px 12px}
button.on{background:var(--ac);color:#1d1406}label{display:flex;gap:5px;align-items:center}
</style></head><body>

let AC,mst,wet,rv,noiseB;
function initAudio(){if(AC){AC.state==='suspended'&&AC.resume();return}
 AC=new(window.AudioContext||window.webkitAudioContext)();mst=AC.createGain();mst.gain.value=.8;const cp=AC.createDynamicsCompressor();mst.connect(cp);cp.connect(AC.destination);
 const Ln=AC.sampleRate*2.6,ib=AC.createBuffer(2,Ln,AC.sampleRate);for(let c=0;c<2;c++){const d=ib.getChannelData(c);for(let i=0;i<Ln;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/Ln,2.6)}
 rv=AC.createConvolver();rv.buffer=ib;wet=AC.createGain();wet.gain.value=.28;mst.connect(rv);rv.connect(wet);wet.connect(cp);
 noiseB=AC.createBuffer(1,AC.sampleRate*.3,AC.sampleRate);const nd=noiseB.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1}
document.getElementById('rev').oninput=e=>{if(wet)wet.gain.value=e.target.value/100};
function noise(t,dur,type,f,q,g,out){const s=AC.createBufferSource();s.buffer=noiseB;const b=AC.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q;const v=AC.createGain();v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(b);b.connect(v);v.connect(out);s.start(t,Math.random()*.1,dur+.02)}
// timbro: fondamentale, ottava, dodicesima, battimento e attacco percussivo
function tone(m,vel,pan,ding,bright){const t=AC.currentTime,f=fq(m),o=AC.createGain(),p=AC.createStereoPanner?AC.createStereoPanner():null;
 if(p){p.pan.value=pan;o.connect(p);p.connect(mst)}else o.connect(mst);o.gain.value=.55;
 [[1,1,5.2,.5],[2.0,.55,3.1,.8],[2.99,.26,1.8,1.1],[4.03,.07,.8,1.6]].forEach(([r,a,dc,bt],i)=>{
  for(let k=0;k<2;k++){const os=AC.createOscillator(),g=AC.createGain();os.type='sine';os.frequency.value=f*r+(k?bt:-bt*.3);
   const A=a*vel*(i>1?.6+bright*.8:1)*.5,D=dc*(ding?1.35:1)*(.75+vel*.35);
   g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(A,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+D);os.connect(g);g.connect(o);os.start(t);os.stop(t+D+.1)}});
 noise(t,.045,'bandpass',f*3.5,1.6,.5*vel*(.6+bright*.7),o);noise(t,.02,'highpass',2500,.7,.25*vel,o)}
function tak(vel,x){const t=AC.currentTime,o=AC.createGain();o.gain.value=.6;o.connect(mst);noise(t,.07,'bandpass',1500+x*600,1.2,.9*vel,o);noise(t,.03,'highpass',4000,.7,.4*vel,o);
 const os=AC.createOscillator(),g=AC.createGain();os.frequency.setValueAtTime(260,t);os.frequency.exponentialRampToValueAtTime(120,t+.08);g.gain.setValueAtTime(.35*vel,t);g.gain.exponentialRampToValueAtTime(.0001,t+.12);os.connect(g);g.connect(o);os.start(t);os.stop(t+.15)}
function gu(vel){const t=AC.currentTime,o=AC.createGain();o.gain.value=.9;o.connect(mst);const os=AC.createOscillator(),g=AC.createGain();os.frequency.setValueAtTime(130,t);os.frequency.exponentialRampToValueAtTime(fq(38),t+.1);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.9*vel,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+1.3);os.connect(g);g.connect(o);os.start(t);os.stop(t+1.4);noise(t,.08,'lowpass',500,.7,.5*vel,o)}
function dead(){const t=AC.currentTime,o=AC.createGain();o.gain.value=.25;o.connect(mst);noise(t,.04,'bandpass',420,2,.6,o)}

function hit(px,py){const ix=(px-ox)/s,iy=(py-oy)/s;if(Math.hypot(ix-GU[0],iy-GU[1])<GU[2]*1.2)return{k:'gu'};
 let bp=null,be=1;for(const p of pads){const e=Math.hypot((ix-p.z[0])/p.z[2],(iy-p.z[1])/p.z[3]);if(e<be){be=e;bp=p}}if(bp)return{k:'pad',p:bp,q:be};
 const ex=(ix-PC[0])/PC[2],ey=(iy-PC[1])/PC[3],d=Math.hypot(ex,ey);if(d>1.08)return null;return d>.9?{k:'rim',nx:ex}:{k:'dead'}}

function tStart(id,px){const now=performance.now(),act=[...ptr.values()].filter(p=>p.up==null);let side=nextSide;if(act.length)side=-act[0].side;else nextSide=-nextSide;ptr.set(id,{side,nx:nxOf(px),down:now,up:null});lastDown=now}
function tMove(id,px){const p=ptr.get(id);if(p)p.nx=nxOf(px)}
function tEnd(id){const p=ptr.get(id);if(p&&p.up==null)p.up=performance.now()}
function sparks(x,y,n){for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*2.4,v=1.5+Math.random()*3;ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,z:2+Math.random()*3})}}
function play(h,px,py,vel){initAudio();const now=performance.now();
 if(h.k==='gu'){gu(vel);guLit=now;fx.push({x:px,y:py,t:now,c:'#ffd27a'});sparks(px,py,6);return}
 if(h.k==='rim'){tak(vel,h.nx);rimLit=now;fx.push({x:px,y:py,t:now,c:'#fff2c0'});sparks(px,py,5);return}
 if(h.k==='dead'){dead();fx.push({x:px,y:py,t:now,c:'#889',s:.4});return}
